name: Fork APK

# Builds an installable, debug-signed APK from any branch in a fork.
# Run it from the Actions tab (Run workflow) or just push to your branch.

on:
  push:
    branches-ignore: [ "master", "staging" ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleGithubDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: budbuddy-case-battery-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
